<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hobby Material Organizer
  </title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="layout">
    <section class="left">
      <section class="drawer" aria-labelledby="form-heading">
        <div id="buttonitems"></div>

       <!--<button class="get-item" id="test" type="button">Search test drawer items</button>
        <button class="get-item" id="fabric" type="button">Search fabric drawer items</button>-->

     </section>
     <section class="panel" aria-labelledby="form-heading">
      <h1 id="form-heading">Add an Item to your collection</h1>
      <p id="form-status" role="status" aria-live="polite"></p>
      <form id="resume-form" novalidate>
        
        <div class="field">
          <label for="job-title">Item Category</label>
          <input id="job-title" name="category" type="text" required maxlength="100" aria-describedby="job-title-error" placeholder="This is the category you will search for your item by">
          <span class="error" id="job-title-error"></span>
        </div>
      <div class="years">
        <div class="field">
          <label for="employer">Colour:</label>
          <input id="employer" name="colour" type="text" maxlength="100" aria-describedby="employer-error" placeholder="blue">
          <span class="error" id="employer-error"></span>
        </div>
        
          <div class="field">
            <label for="start-year">Quantity:</label>
            <input id="start-year" name="quantity" type="string" placeholder="5m" aria-describedby="start-year-error">
            <span class="error" id="start-year-error"></span>
          </div>
          <div class="field">
            <label for="end-year">Location Stored </label>
            <input id="end-year" name="location" type="text" placeholder="shelf" aria-describedby="end-year-error">
            <span class="error" id="end-year-error"></span>
          </div>
        </div>
        <div class="field">
          <label for="accomplishment">Description - Optional</label>
          <textarea id="accomplishment" name="description" rows="2" maxlength="1000" aria-describedby="accomplishment-error" placeholder="any additional notes about this item"></textarea>
          <span class="error" id="accomplishment-error"></span>
        </div>
        <div class="form-actions">
          <button type="submit">Add Item</button>
          <button id="cancel-edit" class="secondary" type="button" hidden>Cancel Edit</button>
        </div>
      </form>
    </section>
    </section>
  <section class="ugh">
    <section class="resume" aria-labelledby="resume-heading">
      <header class="resume-header">
        <h2 id="resume-heading">Items by Category</h2>
        <p class="light-colour">Choose one of the categories beside to see all the ittems of that type</p>
        <div id="resume-status" role="status" aria-live="polite"></div>
      </header>
      <div id="resume-items"></div>
    </section>
    </section>
  </main>
  <template id="resume-item-template">
    <article class="experience">
      <div class="experience-heading"><h3 class="job-title"></h3> </div>
      <div class="details">
      <p class="dates"></p>
      <p class="employer"></p>
       </div>
      <p class="quant"></p>
      <p class="accomplishment"></p>
      <div class="item-actions">
        <button class="edit-item secondary" type="button">Edit</button>
        <button class="delete-item secondary" type="button">Delete</button>
      </div>
    </article>
  </template>
  <template id="button-template">
      <button class="get-item" id="" type="button">template button</button>
  </template>
</body>
</html>
